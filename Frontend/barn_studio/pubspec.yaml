name: barn_studio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Sobrescritura manual de versiones para saltarse las restricciones del SDK
dependency_overrides:
  material_color_utilities: 0.13.1
  test_api: 0.7.15

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/gallery/
  fonts: 
    - family: Barnowl
      fonts:
        - asset: assets/Barnowl-Regular.ttf